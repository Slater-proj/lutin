<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lutin">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2736"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="chapeau" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7cf0b4"/>
      <stop offset="0.55" stop-color="#2fc08f"/>
      <stop offset="1" stop-color="#157a66"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9477"/>
      <stop offset="0.5" stop-color="#5ee0a6"/>
      <stop offset="1" stop-color="#1a9477"/>
    </linearGradient>
    <radialGradient id="lueur">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#fond)"/>
  <!-- étincelle au bout du chapeau -->
  <circle cx="96" cy="30" r="24" fill="url(#lueur)"/>
  <!-- chapeau pointu, la pointe retombe vers la droite -->
  <path d="M28 92 C32 62 46 38 70 30 C84 25 94 28 100 34 C88 36 82 46 84 62 C85 74 90 84 98 92 Z" fill="url(#chapeau)"/>
  <!-- ombre sous le pli -->
  <path d="M84 62 C85 74 90 84 98 92 L74 92 C80 82 82 72 84 62 Z" fill="#0b3d36" opacity="0.28"/>
  <!-- ruban -->
  <path d="M33 80 C52 86 78 86 94 80 L97 90 C78 97 48 97 30 90 Z" fill="#0e1722" opacity="0.55"/>
  <!-- bord du chapeau -->
  <ellipse cx="64" cy="96" rx="44" ry="10" fill="url(#bord)"/>
  <ellipse cx="64" cy="94.6" rx="40" ry="7" fill="#0b0f14" opacity="0.22"/>
  <!-- deux yeux dans l'ombre du chapeau -->
    <circle cx="49" cy="108" r="9.5" fill="#f4fff9"/>
    <circle cx="79" cy="108" r="9.5" fill="#f4fff9"/>
    <circle cx="51.5" cy="109.5" r="4.8" fill="#0b0f14"/>
    <circle cx="81.5" cy="109.5" r="4.8" fill="#0b0f14"/>
    <circle cx="53.4" cy="107.4" r="1.7" fill="#ffffff"/>
    <circle cx="83.4" cy="107.4" r="1.7" fill="#ffffff"/>
  <!-- étincelle -->
  <path d="M100 18 L103 28 L113 31 L103 34 L100 44 L97 34 L87 31 L97 28 Z" fill="#fff1c9"/>
  <circle cx="100" cy="31" r="4" fill="#ffd98a"/>
</svg>
