name: moteurs

# Essais réels de moteurs, à part de la CI principale : ils dépendent d'Internet (GitHub, Hugging Face) et ne doivent jamais bloquer une publication.
# Ils tournent à la main, chaque semaine, et quand le code des moteurs change.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 3"
  push:
    branches: [main]
    paths:
      - "src/lutin/moteur_llamacpp.py"
      - "src/lutin/moteur_openai.py"
      - "src/lutin/essai_moteur.py"
      - ".github/workflows/moteurs.yml"

permissions:
  contents: read

jobs:
  llamacpp-linux-slim:
    name: llama.cpp (processeur) dans python:3.12-slim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Essai réel (installation, démarrage, conversation avec un modèle minuscule)
        # L'image de Lutin « légère » est celle-ci : le programme de llama.cpp publié pour Ubuntu démarre-t-il avec la glibc de Debian ?
        run: |
          set +e
          docker run --rm -v "$PWD:/app" -w /app -e PYTHONPATH=/app/src -e LUTIN_HOME=/tmp/lutin python:3.12-slim \
            python -m lutin essai-moteur llamacpp --modele-test --oui 2>&1 | tee /tmp/essai.txt
          code=${PIPESTATUS[0]}
          # La fin de la sortie devient une annotation de la tâche : lisible sans ouvrir les journaux.
          if [ "$code" != "0" ]; then echo "::error title=essai-moteur::$(tail -c 1500 /tmp/essai.txt | tr -d '\r' | sed ':a;N;$!ba;s/\n/ | /g')"; fi
          exit $code
