name: release

# Chaque envoi sur une branche :
#   - main            -> une publication : version calculée, étiquette vX.Y.Z, GitHub Release (roue, archive source, sommes de contrôle), image Docker :X.Y.Z et :latest
#                        si tools/release_channel.json demande des pré-versions (alpha, beta, rc) : étiquette vX.Y.ZaN, Release marquée « pre-release »
#                        (jamais « dernière version », donc jamais proposée par les installateurs ni par l'annonce de mise à jour), image :X.Y.ZaN et :next, jamais :latest
#   - toute autre     -> une candidate (rc) SANS étiquette ni Release : fichiers joints à l'exécution, image Docker :rc-<branche>
#   - lancement MANUEL (le bouton : Actions > release > Run workflow, choisir la branche) -> une PRÉ-version publiée depuis cette branche
#                        (alpha/beta/rc selon tools/release_channel.json) : étiquette, Release « pre-release », image :next. Jamais une version stable hors de main :
#                        si le canal disait « stable », le travail s'arrête.
# Les règles de version sont dans tools/prochaine_version.py (docs/PUBLISHING.md).
#
# Built once, tested, then published as it is: the version is computed first and given to ci.yml, which builds the wheel, the source archive and the Windows installer
# with it and tests them. What is published are those very files (artifacts of the run): nothing is built again after the tests, and nothing is published if one fails.
on:
  push:
    branches: ["**"]
  workflow_dispatch:          # the button. No box to tick: launching it by hand IS asking for a pre-release of the chosen branch.

concurrency:
  # A publication launched by hand has its own queue: a push on the same branch never cancels it. On main and for a publication, runs follow one another;
  # on a branch, the newest push replaces the older one.
  group: release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      etiquette: ${{ steps.v.outputs.etiquette }}
      publier: ${{ steps.v.outputs.publier }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.nom.outputs.image }}
      balises: ${{ steps.nom.outputs.balises }}
      balises_leger: ${{ steps.nom.outputs.balises_leger }}
      balises_rocm: ${{ steps.nom.outputs.balises_rocm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Calculer la version
        id: v
        run: |
          set -o pipefail          # un canal de publication illisible arrête tout ici, au lieu de laisser des sorties vides
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python tools/prochaine_version.py --mode release | tee -a "$GITHUB_OUTPUT"
            if [ "${GITHUB_REF}" != "refs/heads/main" ] && ! grep -q '^prerelease=true$' "$GITHUB_OUTPUT"; then
              echo "refus : hors de main, seule une PRÉ-version se publie (vérifie tools/release_channel.json)"; exit 1
            fi
          else
            python tools/prochaine_version.py --mode rc --branche "${GITHUB_REF_NAME}" --numero "${GITHUB_RUN_NUMBER}" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Nom de l'image et balises Docker
        id: nom
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.v.outputs.version }}"
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then
            BALISES="${IMAGE}:${VERSION},${IMAGE}:next"
            LEGER="${IMAGE}:${VERSION}-slim,${IMAGE}:next-slim"
            ROCM="${IMAGE}:${VERSION}-rocm,${IMAGE}:next-rocm"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BALISES="${IMAGE}:${VERSION},${IMAGE}:latest"
            LEGER="${IMAGE}:${VERSION}-slim,${IMAGE}:slim"
            ROCM="${IMAGE}:${VERSION}-rocm,${IMAGE}:rocm"
          else
            BRANCHE=$(echo "${GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9._-]/-/g')
            BALISES="${IMAGE}:rc-${BRANCHE},${IMAGE}:${VERSION//+/-}"
            LEGER="${IMAGE}:rc-${BRANCHE}-slim,${IMAGE}:${VERSION//+/-}-slim"
            ROCM="${IMAGE}:rc-${BRANCHE}-rocm,${IMAGE}:${VERSION//+/-}-rocm"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "balises=${BALISES}" >> "$GITHUB_OUTPUT"
          echo "balises_leger=${LEGER}" >> "$GITHUB_OUTPUT"
          echo "balises_rocm=${ROCM}" >> "$GITHUB_OUTPUT"
      - name: Dire sur la page de l'exécution ce qui sort et où le prendre
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLIER: ${{ steps.v.outputs.publier }}
          PRE: ${{ steps.v.outputs.prerelease }}
          BALISES: ${{ steps.nom.outputs.balises }}
        run: |
          DEPOT="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## Lutin ${VERSION}"
            echo
            if [ "${PUBLIER}" != "true" ]; then
              echo "This commit already carries a version tag: the tests run, nothing new is published."
            elif [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ "${PRE}" = "true" ]; then echo "**Pre-release** of the branch \`${GITHUB_REF_NAME}\`. When every job is green it is published here: ${DEPOT}/releases/tag/v${VERSION}"
              else echo "**Release**. When every job is green it is published here: ${DEPOT}/releases/tag/v${VERSION}"; fi
            else
              echo "**Candidate** of the branch \`${GITHUB_REF_NAME}\`: no tag, no Release."
              echo
              echo "- When the jobs are green, the files to try are under **Artifacts** at the bottom of this page: \`lutin-${VERSION}\` (wheel, source archive) and \`installateur-${VERSION}\` (Windows installer)."
              echo "- To publish this branch as a pre-release that anyone can download: [Actions > release](${DEPOT}/actions/workflows/release.yml) > **Run workflow** > branch \`${GITHUB_REF_NAME}\`."
            fi
            if [ "${PUBLIER}" = "true" ]; then
              echo
              echo "Docker, once the job « image Docker » is green: \`docker pull ${BALISES%%,*}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  publier:
    name: publication (version, ou pré-version lancée à la main)
    needs: [version, tests]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The files built and tested by ci.yml in this very run.
      - uses: actions/download-artifact@v8
        with:
          name: lutin-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installateur-${{ needs.version.outputs.version }}
          path: dist
      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Créer l'étiquette et la publication
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.etiquette }}
          target_commitish: ${{ github.sha }}
          name: Lutin ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install or update · Installer ou mettre à jour

            **Windows (installer · installateur)**: `lutin-setup-*.exe` below / ci-dessous (uses the Python you already have, otherwise brings its own / utilise le Python déjà présent, sinon apporte le sien)
            **Windows (PowerShell)**: `irm https://raw.githubusercontent.com/${{ github.repository }}/main/installateur/install.ps1 | iex`
            **Linux / macOS**: `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installateur/install.sh | bash`
            **Docker** (Lutin seul ; le moteur s'installe depuis la page): `docker pull ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}` ([docs/DOCKER.md](https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md), [docs/DOCKER.fr.md](https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.fr.md))

            Running a script on an up-to-date machine changes nothing. Checksums: `SHA256SUMS.txt`.
            Relancer un script sur une machine à jour ne change rien. Sommes de contrôle : `SHA256SUMS.txt`.

  docker:
    name: image Docker
    # After the GitHub Release when there is one (main, or a pre-release started by hand): an image is never pushed for a version whose Release
    # failed (a tag that already exists, for example). On another branch `publier` is skipped and the candidate image is pushed as before.
    needs: [version, tests, publier]
    if: >-
      always() && needs.version.result == 'success' && needs.tests.result == 'success'
      && (needs.publier.result == 'success' || needs.publier.result == 'skipped')
      && needs.version.outputs.publier == 'true' && (github.event.repository.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: The interface built and tested for this run
        uses: actions/download-artifact@v8
        with:
          name: interface
          path: src/lutin/web/app
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image « :latest » et « :X.Y.Z » : Lutin seul, léger ; les moteurs s'installent depuis la page, dans le volume /engines
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: complet
          push: true
          # « :rocm » and « :X.Y.Z-rocm » are the same image (kept for existing compose files; Ollama's ROCm build is chosen at install time):
          # carried by this build instead of a third one that could fail in silence and leave « :rocm » on an old version.
          tags: ${{ needs.version.outputs.balises }},${{ needs.version.outputs.balises_rocm }}
          cache-from: type=gha,scope=complet
          cache-to: type=gha,mode=max,scope=complet
          build-args: LUTIN_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      # « :slim » et « :X.Y.Z-slim » : la même image (nom gardé pour les compose existants ; Ollama peut être un autre conteneur)
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: leger
          push: true
          tags: ${{ needs.version.outputs.balises_leger }}
          cache-from: type=gha,scope=leger
          cache-to: type=gha,mode=max,scope=leger
          build-args: LUTIN_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
