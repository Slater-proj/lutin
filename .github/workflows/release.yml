name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Les tests passent avant toute publication
        run: python tests/lancer_tests.py
      - name: La version de l'étiquette correspond à celle du paquet
        run: |
          V=$(python -c "import sys; sys.path.insert(0,'src'); import lutin; print(lutin.__version__)")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "étiquette ${GITHUB_REF_NAME} ≠ version $V"; exit 1; }
      - run: python -m pip install build && python -m build
      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
# À ajouter avant la première version publique : signature des fichiers (voir docs/DECISIONS.md, « Signature »).
