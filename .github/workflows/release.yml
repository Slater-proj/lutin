name: release

# Chaque envoi sur une branche :
#   - main            -> une publication : version calculée, étiquette vX.Y.Z, GitHub Release (roue, archive source, sommes de contrôle), image Docker :X.Y.Z et :latest
#   - toute autre     -> une candidate (rc) SANS étiquette ni Release : fichiers joints à l'exécution, image Docker :rc-<branche>
# Les tests passent d'abord (ci.yml). Les règles de version sont dans tools/prochaine_version.py (docs/PUBLICATIONS.md).
on:
  push:
    branches: ["**"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}      # sur main, les publications se suivent ; sur une branche, la plus récente remplace l'ancienne

permissions:
  contents: write
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      etiquette: ${{ steps.v.outputs.etiquette }}
      publier: ${{ steps.v.outputs.publier }}
      image: ${{ steps.nom.outputs.image }}
      balises: ${{ steps.nom.outputs.balises }}
      balises_leger: ${{ steps.nom.outputs.balises_leger }}
      balises_rocm: ${{ steps.nom.outputs.balises_rocm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Calculer la version
        id: v
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            python tools/prochaine_version.py --mode release | tee -a "$GITHUB_OUTPUT"
          else
            python tools/prochaine_version.py --mode rc --branche "${GITHUB_REF_NAME}" --numero "${GITHUB_RUN_NUMBER}" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Nom de l'image et balises Docker
        id: nom
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ steps.v.outputs.version }}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BALISES="${IMAGE}:${VERSION},${IMAGE}:latest"
            LEGER="${IMAGE}:${VERSION}-slim,${IMAGE}:slim"
            ROCM="${IMAGE}:${VERSION}-rocm,${IMAGE}:rocm"
          else
            BRANCHE=$(echo "${GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9._-]/-/g')
            BALISES="${IMAGE}:rc-${BRANCHE},${IMAGE}:${VERSION//+/-}"
            LEGER="${IMAGE}:rc-${BRANCHE}-slim,${IMAGE}:${VERSION//+/-}-slim"
            ROCM="${IMAGE}:rc-${BRANCHE}-rocm,${IMAGE}:${VERSION//+/-}-rocm"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "balises=${BALISES}" >> "$GITHUB_OUTPUT"
          echo "balises_leger=${LEGER}" >> "$GITHUB_OUTPUT"
          echo "balises_rocm=${ROCM}" >> "$GITHUB_OUTPUT"

  construire:
    needs: version
    if: needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/verifier_paquet.py dist
      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lutin-${{ needs.version.outputs.version }}
          path: dist/*
          retention-days: 30

  installateur:
    name: installateur Windows
    needs: version
    if: needs.version.outputs.publier == 'true'
    runs-on: windows-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: choco install innosetup --yes --no-progress
      - name: Construire l'installateur
        shell: pwsh
        run: ./installateur/windows/construire.ps1 -Roue (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName -Version "${{ needs.version.outputs.version }}"
      - name: Le vérifier (installation, réinstallation, Python embarqué, désinstallation)
        shell: pwsh
        run: ./installateur/windows/verifier.ps1 -Installateur (Get-ChildItem dist/lutin-setup-*.exe | Select-Object -First 1).FullName -Version "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: installateur-${{ needs.version.outputs.version }}
          path: dist/lutin-setup-*.exe
          retention-days: 30

  publier:
    name: publication (main)
    needs: [version, construire, installateur]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lutin-${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installateur-${{ needs.version.outputs.version }}
          path: dist
      - name: Somme de contrôle de l'installateur
        run: cd dist && sha256sum lutin-setup-*.exe >> SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Créer l'étiquette et la publication
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.etiquette }}
          target_commitish: ${{ github.sha }}
          name: Lutin ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install or update · Installer ou mettre à jour

            **Windows (installer · installateur)**: `lutin-setup-*.exe` below / ci-dessous (uses the Python you already have, otherwise brings its own / utilise le Python déjà présent, sinon apporte le sien)
            **Windows (PowerShell)**: `irm https://raw.githubusercontent.com/${{ github.repository }}/main/installateur/install.ps1 | iex`
            **Linux / macOS**: `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/installateur/install.sh | bash`
            **Docker** (Lutin + Ollama): `docker pull ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}` ([docs/DOCKER.md](https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md), [docs/DOCKER.fr.md](https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.fr.md))

            Running a script on an up-to-date machine changes nothing. Checksums: `SHA256SUMS.txt`.
            Relancer un script sur une machine à jour ne change rien. Sommes de contrôle : `SHA256SUMS.txt`.

  docker:
    name: image Docker
    needs: [version, construire]
    if: needs.version.outputs.publier == 'true' && (github.event.repository.fork == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image complète (Lutin + Ollama) : celle de « :latest » et de « :X.Y.Z »
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: complet
          push: true
          tags: ${{ needs.version.outputs.balises }}
          cache-from: type=gha,scope=complet
          cache-to: type=gha,mode=max,scope=complet
          build-args: LUTIN_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      # Image légère (Lutin seul, Ollama ailleurs) : « :slim » et « :X.Y.Z-slim »
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: leger
          push: true
          tags: ${{ needs.version.outputs.balises_leger }}
          cache-from: type=gha,scope=leger
          cache-to: type=gha,mode=max,scope=leger
          build-args: LUTIN_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      # Image complète pour cartes AMD (base ollama/ollama:*-rocm) : « :rocm » et « :X.Y.Z-rocm ». Jamais vérifiée sur une vraie carte AMD ; un échec de construction ne bloque pas le reste.
      - uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          target: complet
          push: true
          tags: ${{ needs.version.outputs.balises_rocm }}
          cache-from: type=gha,scope=rocm
          cache-to: type=gha,mode=max,scope=rocm
          build-args: |
            LUTIN_VERSION=${{ needs.version.outputs.version }}
            OLLAMA_VARIANT=-rocm
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
