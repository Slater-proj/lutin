name: ci

# Appelé par release.yml (à chaque envoi de branche) et lancé sur chaque pull request.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Style et erreurs évidentes
        run: |
          python -m pip install ruff
          python -m ruff check src tests tools
      - name: Tests (un processus par fichier)
        run: python tests/lancer_tests.py

  paquet:
    name: paquet (roue, archive source) sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Contenu conforme (rien d'inutile, rien d'oublié)
        run: python tools/verifier_paquet.py dist
      - name: Installer la roue dans un environnement vierge et lancer la commande
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m lutin --version
          "$PY" -m lutin securite
          "$PY" -m lutin hors-ligne

  docker:
    name: image Docker (construction et démarrage)
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
    steps:
      - uses: actions/checkout@v4
      - name: "Construire les deux images (complète = Lutin + Ollama, légère = Lutin seul)"
        run: |
          docker build --target leger --build-arg LUTIN_VERSION=0.0.0.dev0 -t lutin:ci-slim .
          docker build --build-arg LUTIN_VERSION=0.0.0.dev0 -t lutin:ci .
      - name: Les commandes répondent
        run: |
          docker run --rm lutin:ci-slim --version
          docker run --rm lutin:ci --version
          docker run --rm --entrypoint ollama lutin:ci --version
      - name: L'image complète démarre toute seule (Ollama dedans, code PIN, page de connexion)
        run: |
          docker run -d --name lutin-ci -p 127.0.0.1:8777:8777 -e LUTIN_NIVEAU=reseau lutin:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8777/ -o page.html && break; sleep 1; done
          grep -q "lutin pin" page.html
          docker logs lutin-ci 2>&1 | grep -E "PIN"
          docker exec lutin-ci lutin pin
          docker exec lutin-ci curl -fsS http://127.0.0.1:11434/api/version
          docker exec lutin-ci lutin modeles lister
          docker exec lutin-ci lutin doctor
          docker rm -f lutin-ci
      - name: L'image légère démarre (sans Ollama, il est ailleurs)
        run: |
          docker run -d --name lutin-slim -p 127.0.0.1:8778:8777 -e LUTIN_NIVEAU=reseau lutin:ci-slim
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8778/ -o page2.html && break; sleep 1; done
          grep -q "lutin pin" page2.html
          docker rm -f lutin-slim

  syntaxe-installateurs:
    name: scripts d'installation (syntaxe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem installateur -Filter *.ps1) {
            $erreurs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erreurs)
            if ($erreurs) { $erreurs | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            Write-Host "OK $($f.Name)"
          }
      - name: Shell
        shell: bash
        run: for f in installateur/*.sh docker/*.sh; do bash -n "$f" && echo "OK $f"; done

  securite:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
