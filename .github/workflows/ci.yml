name: ci

# Appelé par release.yml (à chaque envoi de branche) et lancé sur chaque pull request.
# One run of the tests per push, not two.
#   - a push to a branch of this repository runs `release.yml`, which calls this workflow (workflow_call): that is THE run, and its results are attached to the commit,
#     so they show on the pull request too;
#   - a pull request from the same repository would run the same tests a second time on the same commit: its jobs are skipped (`if:` of every job);
#   - a pull request from a FORK is the one case where no push reached this repository: it runs here.
# The job `gate` is the single result to require in the protection of `main` (see docs/PUBLISHING.md).
#
# Built once, tested, then published as it is:
#   - `interface` builds the interface once; every other job takes that build (artifact `interface`) instead of building its own;
#   - `distribution` builds the wheel and the source archive once, with the version given by the caller; the install jobs and the Windows installer start from that wheel;
#   - what release.yml publishes are these very files (artifacts `lutin-<version>` and `installateur-<version>`): nothing is built a second time after the tests.
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Version written into what is built (wheel, source archive, installer, Docker image). Empty: 0.0.0.dev0"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  interface:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    name: interface (types, tests, construction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend          # the interface is built before anything is tested or packaged (ADR 0002)
      - uses: actions/upload-artifact@v7
        with:
          name: interface
          path: src/lutin/web/app/
          if-no-files-found: error
          overwrite: true          # a job run again in the same run replaces its artifact instead of failing on the name
          retention-days: 7

  style:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 5
    name: style et erreurs évidentes (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Once, not once per test series: what ruff reports depends on pyproject.toml, not on the Python that runs it.
      - run: |
          python -m pip install ruff
          python -m ruff check src tests tools

  tests:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: interface
    timeout-minutes: 25
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Les deux extrémités de Python sur Linux (la plus ancienne gérée et la plus récente), et une version courante sur Windows : trois séries au lieu de huit.
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - name: The interface built for this run
        uses: actions/download-artifact@v8
        with:
          name: interface
          path: src/lutin/web/app
      # The accessibility checks of the browser tests read axe-core from frontend/node_modules: without it they would be skipped in silence.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the pinned development dependencies (no install script is run)
        shell: bash
        working-directory: frontend
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (un processus par fichier)
        run: python tests/lancer_tests.py

  distribution:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: interface
    timeout-minutes: 10
    name: paquet (roue, archive source)
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version || '0.0.0.dev0' }}
    steps:
      - uses: actions/checkout@v7
      - name: The interface built for this run
        uses: actions/download-artifact@v8
        with:
          name: interface
          path: src/lutin/web/app
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Contenu conforme (rien d'inutile, rien d'oublié)
        run: python tools/verifier_paquet.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: lutin-${{ inputs.version || '0.0.0.dev0' }}
          path: dist/*
          if-no-files-found: error
          overwrite: true          # a job run again in the same run replaces its artifact instead of failing on the name
          retention-days: 30

  paquet:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: distribution
    timeout-minutes: 10
    name: paquet installé sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: lutin-${{ inputs.version || '0.0.0.dev0' }}
          path: dist
      - name: Installer la roue dans un environnement vierge et lancer la commande
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m lutin --version
          "$PY" -m lutin security
          "$PY" -m lutin offline

  docker:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: interface
    timeout-minutes: 25
    name: image Docker (construction et démarrage)
    runs-on: ubuntu-latest
    env:
      LUTIN_VERSION: ${{ inputs.version || '0.0.0.dev0' }}
    steps:
      - uses: actions/checkout@v7
      - name: The interface built for this run
        uses: actions/download-artifact@v8
        with:
          name: interface
          path: src/lutin/web/app
      - name: "Construire les deux images (complète = Lutin + Ollama, légère = Lutin seul)"
        run: |
          docker build --target leger --build-arg LUTIN_VERSION="$LUTIN_VERSION" -t lutin:ci-slim .
          docker build --build-arg LUTIN_VERSION="$LUTIN_VERSION" -t lutin:ci .
      - name: Les commandes répondent
        run: |
          docker run --rm lutin:ci-slim --version
          docker run --rm lutin:ci --version
          docker run --rm --entrypoint zstd lutin:ci --version          # de quoi décompresser Ollama, que la page installe
      - name: L'image démarre toute seule (sans moteur dedans, code PIN, page de connexion)
        run: |
          docker run -d --name lutin-ci -p 127.0.0.1:8777:8777 -e LUTIN_NIVEAU=reseau lutin:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8777/ -o page.html && break; sleep 1; done
          grep -q "lutin pin" page.html
          docker logs lutin-ci 2>&1 | grep -E "PIN"
          docker exec lutin-ci lutin pin
          docker exec lutin-ci lutin doctor > doctor0.txt || true          # sans moteur installé, le bilan peut signaler un problème : ce qui compte, c'est qu'il s'exécute et reconnaisse Docker
          grep -qi "docker" doctor0.txt
      - name: Dans le conteneur, l'API répond de bout en bout (réglages, pièce jointe, santé, dossiers de travail)
        run: |
          T=$(docker exec lutin-ci python3 -c "import json;print(json.load(open('/data/donnees/console.json'))['jeton'])")
          API() { docker exec -i lutin-ci curl -fsS -H "X-Token: $T" "$@"; }
          API http://127.0.0.1:8777/api/v1/settings | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['mode']=='general', d['mode']"
          API -X PATCH -H "Content-Type: application/json" -d '{"mode":"research","conversation_backup":true}' http://127.0.0.1:8777/api/v1/settings | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['mode']=='research' and d['conversation_backup'] is True, d"
          API -X POST -H "X-Name: note.txt" --data-binary 'bonjour, une note' http://127.0.0.1:8777/api/v1/attachments | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['name']=='note.txt' and d['characters']==17, d"
          API http://127.0.0.1:8777/api/v1/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['level'] in ('ok','warning','critical'), d['level']"
          API http://127.0.0.1:8777/api/v1/projects | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['projects'], d"
          API "http://127.0.0.1:8777/api/v1/projects/folders?path=/workspace" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['path'].endswith('workspace'), d"
          docker exec lutin-ci test -d /data/donnees/pieces
          API http://127.0.0.1:8777/api/v1/engines | python3 -c "import sys,json; d=json.load(sys.stdin); m={x['id']:x for x in d['engines']}; assert m['ollama']['actions']['install']['possible'] and m['llamacpp']['actions']['install']['possible'], 'les moteurs doivent pouvoir s installer depuis la page'"
          API http://127.0.0.1:8777/api/v1/setup | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['needed'] is True, d"
          docker rm -f lutin-ci
      - name: L'image légère (même image) démarre
        run: |
          docker run -d --name lutin-slim -p 127.0.0.1:8778:8777 -e LUTIN_NIVEAU=reseau lutin:ci-slim
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8778/ -o page2.html && break; sleep 1; done
          grep -q "lutin pin" page2.html
          docker rm -f lutin-slim
      - name: Recréer le conteneur ne perd rien (volumes nommés /data et /models)
        run: |
          docker volume create ci-data
          docker volume create ci-models
          docker run -d --name lutin-vol -p 127.0.0.1:8779:8777 -v ci-data:/data -v ci-models:/models -e LUTIN_NIVEAU=reseau lutin:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8779/ -o page3.html && break; sleep 1; done
          docker exec lutin-vol sh -c 'echo marque-donnees > /data/MARQUE && echo marque-modeles > /models/MARQUE'
          docker exec lutin-vol lutin doctor | tee doctor.txt
          ! grep -q "n'est pas un volume\|is not a volume" doctor.txt
          docker rm -f lutin-vol
          docker run -d --name lutin-vol2 -p 127.0.0.1:8779:8777 -v ci-data:/data -v ci-models:/models -e LUTIN_NIVEAU=reseau lutin:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8779/ -o page4.html && break; sleep 1; done
          test "$(docker exec lutin-vol2 cat /data/MARQUE)" = "marque-donnees"
          test "$(docker exec lutin-vol2 cat /models/MARQUE)" = "marque-modeles"
          docker rm -f lutin-vol2

  installateur-linux:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: distribution
    timeout-minutes: 10
    name: install.sh (installation, réinstallation)
    runs-on: ubuntu-latest
    env:
      LUTIN_VERSION: ${{ inputs.version || '0.0.0.dev0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: lutin-${{ inputs.version || '0.0.0.dev0' }}
          path: dist
      - name: Installer, réinstaller (rien ne change), dans les deux langues
        run: |
          export LUTIN_SOURCE="$PWD/$(ls dist/*.whl)" LUTIN_DOSSIER="$RUNNER_TEMP/lutin" LUTIN_BIN="$RUNNER_TEMP/bin"
          LUTIN_LANGUE=en bash installateur/install.sh --sans-setup | tee un.txt
          grep -q "installed" un.txt
          LUTIN_LANGUE=en bash installateur/install.sh --sans-setup | tee deux.txt
          grep -q "already up to date" deux.txt
          LUTIN_LANGUE=fr bash installateur/install.sh --sans-setup | tee trois.txt
          grep -q "deja a jour" trois.txt
          "$LUTIN_BIN/lutin" --version | grep -qF "$LUTIN_VERSION"
          LUTIN_HOME="$RUNNER_TEMP/donnees" LUTIN_LANGUE=en "$LUTIN_BIN/lutin" securite | grep -q "this machine only"

  installateur-windows:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: distribution
    timeout-minutes: 30
    name: installateur Windows (construction, installation, désinstallation)
    runs-on: windows-latest
    env:
      LUTIN_VERSION: ${{ inputs.version || '0.0.0.dev0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: lutin-${{ inputs.version || '0.0.0.dev0' }}
          path: dist
      - run: choco install innosetup --yes --no-progress
      - name: Construire l'installateur
        shell: pwsh
        run: ./installateur/windows/construire.ps1 -Roue (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName -Version $env:LUTIN_VERSION
      - name: L'installer, le réinstaller, le désinstaller
        shell: pwsh
        run: ./installateur/windows/verifier.ps1 -Installateur (Get-ChildItem dist/lutin-setup-*.exe | Select-Object -First 1).FullName -Version $env:LUTIN_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: installateur-${{ inputs.version || '0.0.0.dev0' }}
          path: dist/lutin-setup-*.exe
          if-no-files-found: error
          overwrite: true          # a job run again in the same run replaces its artifact instead of failing on the name
          retention-days: 30

  syntaxe-installateurs:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 5
    name: scripts d'installation (syntaxe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem installateur -Filter *.ps1 -Recurse) {
            $erreurs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erreurs)
            if ($erreurs) { $erreurs | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            Write-Host "OK $($f.Name)"
          }
      - name: Shell
        shell: bash
        run: for f in installateur/*.sh docker/*.sh; do bash -n "$f" && echo "OK $f"; done

  securite:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: ci (résultat)
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [interface, style, tests, distribution, paquet, docker, installateur-linux, installateur-windows, syntaxe-installateurs, securite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les travaux ont réussi
        run: |
          echo "résultats : ${{ join(needs.*.result, ' ') }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "un travail a échoué, a été annulé ou n'a pas tourné"; exit 1
          fi
