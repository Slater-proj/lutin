name: Report a bug / Signaler un bug
description: Something does not work as expected / Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste a conversation or a personal file. For a security vulnerability, do not use this form: see SECURITY.md. / Ne colle jamais de conversation ni de fichier personnel. Pour une faille de sécurité, n'utilise pas ce formulaire : voir SECURITY.md."
  - type: textarea
    id: ce-qui-se-passe
    attributes:
      label: What happens / Ce qui se passe
      description: What you did, what you expected, what you got. English or French. / Ce que tu as fait, ce que tu attendais, ce que tu as obtenu. En français ou en anglais.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lutin doctor` / Résultat de `lutin doctor`
      description: It contains no conversation and no personal path. / Il ne contient ni conversation ni chemin personnel.
      render: text
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: System / Système
      options: [Windows, Linux, macOS, Docker]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`lutin --version`)
