name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Ne colle jamais de conversation ni de fichier personnel. Pour une faille de sécurité, n'utilise pas ce formulaire : voir SECURITY.md."
  - type: textarea
    id: ce-qui-se-passe
    attributes:
      label: Ce qui se passe
      description: Ce que tu as fait, ce que tu attendais, ce que tu as obtenu.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Résultat de `lutin doctor`
      description: Il ne contient ni conversation ni chemin personnel.
      render: text
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: Système
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`lutin --version`)
