# Mises à jour des outils de la CI : une seule demande groupée par mois (et non une par outil chaque semaine).
# One grouped pull request per month for the CI tooling (instead of one per tool every week).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      outils-ci:
        patterns: ["*"]
    open-pull-requests-limit: 2
  # The tools of the interface (frontend/, development dependencies only: nothing of it is shipped), one grouped request per month.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      interface:
        patterns: ["*"]
    open-pull-requests-limit: 2
  # The base image of the Docker build.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
