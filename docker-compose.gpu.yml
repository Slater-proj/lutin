# Adds the NVIDIA card (needs the NVIDIA Container Toolkit on the host, see docs/DOCKER.md) / Ajoute la carte NVIDIA (NVIDIA Container Toolkit sur l'hôte) :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  lutin:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
