# Intel integrated graphics (Arc / Xe) through Vulkan / Carte graphique intégrée Intel (Arc / Xe) par Vulkan :
#   docker compose -f docker-compose.yml -f docker-compose.intel.yml up -d
# Uses Ollama's experimental Vulkan support (OLLAMA_VULKAN=1, Ollama 0.12.11 or later) / Utilise le support Vulkan expérimental d'Ollama (OLLAMA_VULKAN=1, Ollama 0.12.11 ou plus).
# Measured once on a Core Ultra 5 125H: the chip WORKS (100% GPU) but was SLOWER than the processor (about 8 vs 11 tokens/s on qwen3:4b). Try it, measure, and drop it if it is slower / Mesuré une fois sur un Core Ultra 5 125H : la puce fonctionne (100 % GPU) mais était PLUS LENTE que le processeur (environ 8 contre 11 jetons/s sur qwen3:4b). Essaie, mesure, et retire-le si c'est plus lent.
# The NPU is NOT used (no gain on Meteor Lake, see docs/DOCKER.md) / Le NPU n'est PAS utilisé (aucun gain sur Meteor Lake, voir docs/DOCKER.fr.md).
services:
  lutin:
    devices:
      - /dev/dri
    group_add:
      - "${RENDER_GID:-109}"          # group of /dev/dri/renderD* on the host: getent group render | cut -d: -f3
    environment:
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"          # Ollama ignores integrated GPUs unless told otherwise / Ollama écarte les cartes intégrées sauf indication contraire
