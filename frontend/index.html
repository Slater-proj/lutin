<!doctype html>
<html lang="__LANGUAGE__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Written by the server (lutin.web_app.page): the page token protects against requests made by other sites. -->
    <meta name="lutin-token" content="__TOKEN__" />
    <meta name="lutin-version" content="__VERSION__" />
    <title>Lutin</title>
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <!-- « Add to home screen » on a phone: the manifest and the icons are drawn by the server (lutin.server._statique_pwa). -->
    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lutin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
