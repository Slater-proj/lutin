# Lutin + Ollama in ONE container / Lutin et Ollama dans UN seul conteneur.
#   docker compose up -d        (NVIDIA card / carte NVIDIA : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d)
# See / Voir docs/DOCKER.md (EN) and docs/DOCKER.fr.md (FR).
services:
  lutin:
    image: ghcr.io/slater-proj/lutin:latest
    # To build the image yourself instead of downloading it / Pour la construire toi-même : build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8777:8777"           # this machine only / seulement cette machine. For your LAN / pour ton réseau local : "8777:8777" (read docs/SECURITY.md first)
    environment:
      # LUTIN_LANGUE: fr                # fr or en. Optional: the language is also a setting of the page (Settings) / facultatif : la langue se règle aussi dans la page (Réglages). Default / défaut : en
      LUTIN_NIVEAU: reseau              # reseau (PIN code / code PIN) or proxy (behind Authelia & co: add LUTIN_URL_PUBLIQUE and LUTIN_PROXY_IP)
      # LUTIN_URL_PUBLIQUE: https://lutin.example.com
      # LUTIN_PROXY_IP: 172.18.0.1,192.168.1.10
      # LUTIN_HORS_LIGNE: "1"           # strict offline mode / mode hors ligne strict : no connection to the Internet / aucune connexion vers Internet
      # LUTIN_TRAVAUX: /travail/project-2,/travail/documents      # other workspace folders (mounted below) / autres dossiers de travail (montés ci-dessous)
      # LUTIN_GPU: "NVIDIA RTX 4090=24" # card declared by hand if not detected / carte déclarée à la main si elle n'est pas détectée (name=memory in GB)
    volumes:
      - lutin-data:/data                # configuration, conversations, memory, action log / mémoire, journal
      - lutin-models:/models            # the models (several GB): a named volume, or a folder of your choice (/mnt/big-disk/models:/models) / les modèles (plusieurs Go)
      - ./travail:/travail              # the workspace folder: the ONLY place Lutin can read and modify / le dossier de travail : le SEUL endroit que Lutin peut lire et modifier
      # - ./project-2:/travail/project-2

volumes:
  lutin-data:
  lutin-models:
